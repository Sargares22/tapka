<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tapka</title>
<style>
  /* The settings window, in the manner of Windows 11's own programs: sections on the left, cards
     on the right that stand out from the page by a step of shade, not by lines; the same theme
     and accent as the capsule. */
  :root{
    --bg:#161616;--s1:#2d2d2d;--s2:#363636;--s3:#3e3e3e;--field:#383838;--dlg:#1b1b1b;
    --ink:#fff;--ink-2:#d0d0d0;--dim:#a8a8a8;--sep:rgba(255,255,255,.07);--hi:inset 0 1px 0 rgba(255,255,255,.05);
    --shade:rgba(0,0,0,.55);--key:#1c1d22;--key-ink:#e6e8ee;--danger:#ff99a4;--warn:#ffb340;--ok:#6ccb5f;
    --pill:#0e0f12;--pill-key:#1c1d22;--pill-ink:#e6e8ee;
    --accent:#8ab4ff;--accent-fill:#1a6cff;--on-accent:#fff;
  }
  :root[data-theme=light]{
    --bg:#dedfe3;--s1:#fff;--s2:#f3f4f6;--s3:#e6e7ea;--field:#f3f4f6;--dlg:#ebecef;
    --ink:#16181b;--ink-2:#3c4047;--dim:#595e66;--sep:rgba(0,0,0,.08);--hi:inset 0 0 0 1px rgba(0,0,0,.04);
    --shade:rgba(0,0,0,.3);--key:#eceef2;--key-ink:#2a2d34;--danger:#c42b1c;--warn:#a85600;--ok:#0f7b0f;
    --pill:#eef0f4;--pill-key:#fff;--pill-ink:#2a2d34;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.4 "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;user-select:none}
  button,input,select{font:inherit;color:inherit}
  button{cursor:default}
  #app{display:flex;height:100%}

  #side{flex:0 0 200px;padding:12px 8px;display:flex;flex-direction:column;gap:2px}
  .nav{position:relative;display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;border:0;border-radius:6px;background:none;text-align:left}
  .nav:hover,.nav.on{background:var(--s1)}
  .nav.on::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:2px;background:var(--accent)}
  .nav svg{width:18px;height:18px;flex:none}

  #pane{flex:1;min-width:0;overflow:auto;padding:14px 26px 28px 18px}
  section{display:none;max-width:760px}
  section.on{display:block}
  h1{font:600 28px/1.2 "Segoe UI Variable Display","Segoe UI",sans-serif;margin:6px 0 16px;letter-spacing:-.2px}
  .head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:6px 0 16px}
  .head h1{margin:0}
  h2{font-size:14px;font-weight:600;margin:20px 2px 8px}
  .group{background:var(--s1);border-radius:10px;box-shadow:var(--hi);overflow:hidden}
  .group+.group{margin-top:10px}
  .row{position:relative;display:flex;align-items:center;gap:14px;width:100%;min-height:64px;padding:10px 16px;border:0;background:none;text-align:left}
  button.row:hover{background:var(--s2)}
  .row+.row::before{content:"";position:absolute;top:0;left:16px;right:0;height:1px;background:var(--sep)}
  #items .row+.row::before{left:94px}
  .lbl{flex:1;min-width:0}
  .lbl b{display:block;font-weight:400;font-size:14.5px}
  .lbl small{display:block;color:var(--dim);font-size:12.5px;margin-top:1px}
  .ell,.lbl small.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sub{color:var(--dim);font-size:12.5px}
  .foot{color:var(--dim);font-size:12.5px;margin:10px 4px 0}
  .problem{color:var(--danger)!important}
  .lbl small.warn,.lbl b.warn{color:var(--warn)}
  .warn{color:var(--warn)}

  /* One button for the whole window; the accent fill only where the main step is */
  .btn{height:34px;padding:0 16px;border:0;border-radius:6px;background:var(--s3);white-space:nowrap}
  .btn:hover{filter:brightness(1.08)}
  .btn.acc{background:var(--accent-fill);color:var(--on-accent);font-weight:600}
  .btn.danger{background:none;color:var(--danger);padding:0 10px}
  .btn:disabled{opacity:.45}
  .link{border:0;background:none;padding:0;color:var(--accent);font-size:inherit}
  .btn:focus-visible,.nav:focus-visible,.row:focus-visible,.tile:focus-visible,.link:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  .x{width:32px;height:32px;border:0;border-radius:6px;background:none;display:grid;place-items:center;color:var(--dim);flex:none}
  .x:hover{background:var(--s2)}
  .x svg{width:15px;height:15px}
  select,input[type=text]{height:34px;padding:0 10px;border:0;border-radius:6px;background:var(--field);outline:none;box-shadow:inset 0 -1px 0 var(--sep)}
  select{min-width:170px}
  select option{background:var(--dlg);color:var(--ink)}
  input[type=text]{width:100%;user-select:text}
  input[type=text]:focus,select:focus{box-shadow:inset 0 -2px 0 var(--accent)}
  input::placeholder{color:var(--dim)}
  .seg{display:inline-flex;background:var(--s3);border-radius:8px;padding:2px;flex:none}
  .seg button{height:30px;padding:0 12px;border:0;border-radius:6px;background:none;color:var(--ink-2)}
  .seg button.on{background:var(--s1);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.25);font-weight:600}
  .switch{position:relative;flex:none;width:40px;height:20px;border-radius:10px;border:1px solid var(--dim);background:none;padding:0}
  .switch::after{content:"";position:absolute;top:3px;left:3px;width:12px;height:12px;border-radius:50%;background:var(--ink-2);transition:left .12s}
  .switch.on{background:var(--accent-fill);border-color:var(--accent-fill)}
  .switch.on::after{left:23px;background:var(--on-accent)}

  /* An item as the capsule shows it: a key with its picture */
  .key{flex:none;width:40px;height:40px;border-radius:11px;background:var(--key);color:var(--key-ink);box-shadow:inset 0 0 0 1px rgba(128,128,128,.2);display:grid;place-items:center}
  .key svg{width:20px;height:20px}
  .key img{width:24px;height:24px;object-fit:contain;pointer-events:none}
  .key.big{width:56px;height:56px;border-radius:15px}
  .key.big svg{width:26px;height:26px}
  .key.big img{width:32px;height:32px}
  .key.small{width:32px;height:32px;border-radius:9px}
  .key.small svg{width:16px;height:16px}
  .key.small img{width:20px;height:20px}
  /* A picture that would not read on its key: of one colour, it is drawn in the ink of the theme;
     any other gets a plate of that ink (see legible) */
  .key .sign{width:24px;height:24px;background:currentColor;mask:center/contain no-repeat}
  .key.big .sign{width:32px;height:32px}
  .key.small .sign{width:20px;height:20px}
  .key.plate img{box-sizing:content-box;padding:3px;border-radius:7px;background:var(--key-ink)}
  #items .row,#meters .row{padding-left:4px;background:var(--s1)}
  #items .row:hover,#meters .row:hover,#docked .row:hover{background:var(--s2)}
  #items .row.carried,#meters .row.carried{z-index:2;box-shadow:0 6px 18px var(--shade);border-radius:10px}
  #items .row.carried::before,#meters .row.carried::before{display:none}
  #meters .row.broken{padding-left:26px}
  .grip{flex:none;align-self:stretch;width:28px;margin-right:-6px;display:grid;place-items:center;color:var(--dim);opacity:.6;touch-action:none;cursor:grab}
  .row:hover .grip{opacity:1}
  .grip svg{width:14px;height:14px}
  .chev{flex:none;width:16px;height:16px;color:var(--dim)}
  .tag{display:inline-block;padding:0 7px;border-radius:5px;background:var(--s3);color:var(--ink-2);font-size:11.5px;line-height:18px;margin-right:6px;vertical-align:1px}
  /* Where an AI service stands: a dot when connected, a spinner while it is being checked */
  .state .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:6px;vertical-align:1px}
  .state .spin{display:inline-block;width:10px;height:10px;border:1.5px solid currentColor;border-right-color:transparent;border-radius:50%;margin-right:6px;vertical-align:-1px;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .state.sign_in,.state.error,.state.missing{color:var(--warn)}
  .does .btn{margin-left:auto}
  .tick{flex:none;width:20px;height:20px;border-radius:5px;box-shadow:inset 0 0 0 1px var(--dim);display:grid;place-items:center;color:var(--on-accent)}
  .tick svg{width:14px;height:14px;visibility:hidden}
  .on>.tick{background:var(--accent-fill);box-shadow:none}
  .on>.tick svg{visibility:visible}
  /* The card of programs: each a chip with its icon and a tick */
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{display:flex;align-items:center;gap:8px;height:42px;padding:0 10px 0 5px;border:0;border-radius:8px;background:var(--s2);box-shadow:var(--hi);max-width:220px}
  .chip>span:nth-child(2){flex:1;min-width:0;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .chip.on{box-shadow:inset 0 0 0 2px var(--accent)}
  .acts{display:flex;gap:8px;align-items:center;flex:1}
  /* The welcome of the first run: this page alone in a small window beside the capsule, with the
     card of programs and nothing else */
  body.welcome{background:var(--dlg)}
  body.welcome #app{display:none}
  #welcome{display:flex;flex-direction:column;gap:8px;height:100%;padding:18px 20px 16px}
  #welcome h1{font-size:22px;margin:0}
  #welcome .sub{font-size:13.5px;color:var(--ink-2)}
  /* The window is as tall as the card (fitWelcome); on a screen too short for it the programs scroll */
  #welcome .chips{flex:0 1 auto;min-height:0;overflow:auto;scrollbar-width:thin;scrollbar-color:var(--dim) transparent;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-content:start;margin-top:8px}
  #welcome .chip{max-width:none}
  #welcome .acts{flex:none;margin-top:auto;padding-top:8px}

  /* Look */
  .themes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:14px}
  .th{border:0;background:none;padding:0;display:grid;gap:8px;justify-items:start;font-size:13px}
  .pv{position:relative;display:block;width:100%;aspect-ratio:16/10;border-radius:8px;overflow:hidden;box-shadow:0 0 0 1px var(--sep)}
  .th.on .pv{box-shadow:0 0 0 2px var(--accent)}
  .pv i{position:absolute;display:block;border-radius:4px}
  .swl{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:14px}
  .swatch{width:38px;height:38px;border-radius:50%;border:0;padding:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
  .swatch.on{box-shadow:0 0 0 2px var(--s1),0 0 0 4px var(--ink)}
  .own{position:relative;width:38px;height:38px;border-radius:50%;overflow:hidden;box-shadow:inset 0 0 0 1px var(--dim);display:grid;place-items:center;color:var(--dim)}
  .own.on{box-shadow:0 0 0 2px var(--s1),0 0 0 4px var(--ink)}
  .own svg{width:16px;height:16px;pointer-events:none}
  .own input{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:0;padding:0}
  .caps{display:flex;gap:28px;align-items:center;padding:16px 18px}
  .capbox{flex:none;width:110px;height:170px;display:grid;place-items:center}
  .capsule{background:var(--pill);border-radius:16px;padding:8px;display:grid;gap:6px;justify-items:center;box-shadow:0 0 0 1px var(--sep);transition:transform .15s}
  .capsule .key{width:34px;height:34px;border-radius:10px;background:var(--pill-key);color:var(--pill-ink)}
  .capsule .key svg{width:17px;height:17px}
  .screen{position:relative;width:180px;height:112px;border-radius:8px;background:var(--s3);flex:none}
  .screen button{position:absolute;border:0;padding:0;border-radius:6px;background:var(--dim);opacity:.45}
  .screen button:hover{opacity:.7}
  .screen button.on{background:var(--accent-fill);opacity:1}

  /* The dialog */
  #shade{position:fixed;inset:0;background:var(--shade);display:none;place-items:center;padding:18px}
  #shade.on{display:grid}
  #dialog{width:min(500px,100%);max-height:calc(100vh - 36px);display:flex;flex-direction:column;background:var(--dlg);border-radius:12px;box-shadow:0 24px 60px rgba(0,0,0,.35),var(--hi)}
  #dialog header{display:flex;align-items:center;gap:8px;padding:14px 12px 6px 20px;font:600 19px "Segoe UI Variable Display","Segoe UI",sans-serif}
  #dialog header .x{margin:-4px 0}
  #back:not([hidden])+#title{margin-left:-6px}
  #title{flex:1}
  #body{padding:6px 20px 8px;overflow:auto;display:grid;gap:14px}
  #dialog footer{display:flex;gap:8px;padding:14px 20px;align-items:center}
  #dialog footer:empty{padding:7px}
  .spring{flex:1}
  .field{display:grid;gap:6px}
  .field>label{font-size:12.5px;color:var(--dim)}
  .inline{display:flex;gap:6px;align-items:center}
  .namebox{display:flex;gap:14px;align-items:center}
  .namebox input{font-size:17px;height:40px}
  .does{display:flex;align-items:center;gap:10px;min-height:52px;padding:8px 12px;background:var(--s1);border-radius:8px;box-shadow:var(--hi)}
  details summary{color:var(--accent);font-size:13px;list-style:none;padding:2px 0}
  details summary::-webkit-details-marker{display:none}
  details summary::before{content:"›";display:inline-block;width:10px;margin-right:4px;transition:transform .12s}
  details[open] summary::before{transform:rotate(90deg)}
  .more{margin-top:8px;display:grid;gap:8px}
  .why{font:12px/1.45 Consolas,ui-monospace,monospace;color:var(--ink-2);word-break:break-all;user-select:text}
  .caps-row{display:inline-flex;align-items:center;flex-wrap:wrap;gap:2px}
  .kc{display:inline-grid;place-items:center;min-width:36px;height:32px;padding:0 10px;border-radius:7px;background:var(--key);color:var(--key-ink);font-weight:600;box-shadow:inset 0 -2px 0 rgba(0,0,0,.25)}
  .plus{color:var(--dim);margin:0 4px}
  .progs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .prog{height:36px;padding:0 12px;border:0;border-radius:8px;background:var(--s1);box-shadow:var(--hi)}
  .prog.on{box-shadow:inset 0 0 0 2px var(--accent)}
  .gl{display:grid;grid-template-columns:repeat(auto-fill,40px);gap:6px;margin-top:8px}
  .gl>button{border:0;padding:0;background:none;border-radius:12px}
  .gl>button.on{box-shadow:0 0 0 2px var(--accent)}
  .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:6px}
  .tile{display:grid;justify-items:center;align-content:start;gap:6px;padding:12px 6px 10px;border:0;border-radius:10px;background:var(--s1);box-shadow:var(--hi);font-size:12.5px;text-align:center}
  .tile:hover{background:var(--s2)}
  .glabel{font-size:12px;color:var(--dim);margin:4px 2px -6px;font-weight:600}
  .set{display:grid;gap:10px;padding:12px 14px}
  .set .icons{display:flex;gap:5px;flex-wrap:wrap}
  .say{padding:12px 16px;color:var(--dim)}
  #body .group+.group{margin-top:0}
  #body .row+.row::before{left:70px}
  #toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);display:none;align-items:center;gap:14px;background:var(--dlg);border-radius:8px;padding:8px 10px 8px 16px;box-shadow:0 8px 24px var(--shade),var(--hi);white-space:nowrap}
  #toast.on{display:flex}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <nav id="side">
    <button class="nav on" data-s="items"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="4" y="4" width="6.5" height="6.5" rx="1.6"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.6"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.6"/><path d="M16.75 13.5v6.5M13.5 16.75H20"/></svg><span data-t="nav_items"></span></button>
    <button class="nav" data-s="meters"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 16.5a7.5 7.5 0 1 1 15 0"/><path d="M12 16.5l3.5-4.5M8.5 20h7"/></svg><span data-t="nav_meters"></span></button>
    <button class="nav" data-s="docked"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="11" height="15" rx="2.5"/><rect x="17" y="4.5" width="3.5" height="15" rx="1.5"/></svg><span data-t="nav_docked"></span></button>
    <button class="nav" data-s="look"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><path d="M12 4v16"/><path d="M12 8h6.9M12 12h8M12 16h6.9"/></svg><span data-t="nav_look"></span></button>
    <button class="nav" data-s="general"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 12h3M11 12h9M4 17h9M17 17h3"/><circle cx="16" cy="7" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="15" cy="17" r="2"/></svg><span data-t="nav_general"></span></button>
    <button class="nav" data-s="about"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5.5"/><path d="M12 7.6v.1"/></svg><span data-t="nav_about"></span></button>
  </nav>
  <main id="pane">
    <section id="s-items" class="on">
      <div class="head"><h1 data-t="nav_items"></h1><button class="btn acc" id="add" data-t="add"></button></div>
      <div class="group" id="file-error" hidden><div class="row"><div class="lbl"><b class="problem" data-t="file_error"></b><details><summary data-t="more"></summary><div class="more why" id="file-why"></div></details></div><button class="btn" id="file-open" data-t="open"></button></div></div>
      <div class="group" id="repaired" hidden></div>
      <div class="group" id="items"></div>
      <p class="foot" id="items-foot" data-t="items_foot"></p>
      <p class="foot" id="find-line"><button class="link" id="find" data-t="find"></button></p>
    </section>
    <section id="s-meters">
      <div class="head" id="meters-head"><h1 data-t="nav_meters"></h1><button class="btn acc" id="add-meter" data-t="meter_add"></button></div>
      <div class="group" id="meters"></div>
      <p class="foot" id="meters-foot" data-t="meters_foot"></p>
    </section>
    <section id="s-docked">
      <div class="head" id="docked-head"><h1 data-t="nav_docked"></h1><button class="btn acc" id="add-docked" data-t="dock_add"></button></div>
      <div class="group" id="docked"></div>
      <p class="foot" id="docked-foot" data-t="docked_foot"></p>
    </section>
    <section id="s-look">
      <h1 data-t="nav_look"></h1>
      <h2 data-t="theme"></h2>
      <div class="group"><div class="themes" id="theme"></div></div>
      <h2 data-t="accent"></h2>
      <div class="group"><div class="swl" id="swatches"></div></div>
      <h2 data-t="capsule"></h2>
      <div class="group"><div class="caps">
        <div class="capbox"><div class="capsule" id="capsule"></div></div>
        <div style="display:grid;gap:10px;justify-items:start">
          <div class="seg" id="scale"><button data-v="0.8" data-t="size_s"></button><button data-v="1" data-t="size_m"></button><button data-v="1.25" data-t="size_l"></button></div>
          <div class="screen" id="edge"><button data-v="left" style="left:6px;top:28px;width:10px;height:56px"></button><button data-v="top" style="left:62px;top:6px;width:56px;height:10px"></button><button data-v="right" style="right:6px;top:28px;width:10px;height:56px"></button></div>
          <span class="sub" data-t="edge_sub"></span>
        </div>
      </div></div>
      <div class="group">
        <div class="row"><div class="lbl"><b data-t="tablet_only"></b><small data-t="tablet_only_sub"></small></div><button class="switch" id="tablet-only" role="switch"></button></div>
        <div class="row"><div class="lbl"><b data-t="click_sound"></b><small data-t="click_sound_sub"></small></div><button class="switch" id="click-sound" role="switch"></button></div>
      </div>
    </section>
    <section id="s-general">
      <h1 data-t="nav_general"></h1>
      <div class="group">
        <div class="row"><div class="lbl"><b data-t="lang"></b></div>
          <select id="lang"><option value="system" data-t="lang_system"></option><option value="ru">Русский</option><option value="en">English</option></select></div>
        <div class="row"><div class="lbl"><b data-t="autostart"></b></div><button class="switch" id="autostart" role="switch"></button></div>
        <div class="row"><div class="lbl"><b data-t="updates"></b><small><span id="update-state"></span> <button class="link" id="update-check" data-t="update_check"></button></small></div>
          <button class="btn acc" id="update-go" data-t="update_go" hidden></button><button class="switch" id="updates" role="switch"></button></div>
      </div>
      <div class="group"><details id="expert"><summary data-t="expert" style="padding:14px 16px"></summary>

  // A new meter goes last; one whose source is being changed (`replacing`: its place and the meter as

  function appendMeter(raw) {

  function editMeter(i) {

  // A program from the same list as a new key's, an AI service, or, for the advanced, a file from a

  function addMeter() {

  // The four services, each with where it stands; one that is not connected is added and offers to

  // ---------- docking: panels of other programs, each told by its program's path and its window
  // class, stand under the capsule. An entry of an older version is the program's file name alone
  const dockedRaws = () => S.docked.map(d => d.raw);
  const exeOf = raw => (typeof raw === 'string' ? raw : str(fields(raw).exe)).trim().toLowerCase();
  // Whether a docked entry already takes the panel a candidate entry would dock
  const takes = (raw, candidate) => {
    const f = fields(raw), c = fields(candidate);
    if (typeof raw === 'string' || !str(f.path)) return exeOf(raw) === exeOf(candidate);
    return str(f.path).toLowerCase() === str(c.path).toLowerCase() && str(f.class) === str(c.class);
  };
  // As the meters: the list changes at once and goes back, read again, when the file could not be
  // written. `known` are the cards of the panels just ticked, each with its window, which its entry
  // goes by from now on
  function saveDocked(list, known = []) {
    const before = S.docked;
    S.docked = list.map(raw => before.find(d => d.raw === raw) || known.find(d => d.raw === raw) || { raw, name: exeOf(raw).replace(/\.exe$/, ''), icon: null, state: 'placed' });
    drawDocked();
    const chosen = known.map(p => p.window).filter(Boolean);
    return invoke('save_docked', { docked: list, chosen }).catch(e => { S.docked = before; drawDocked(); toast(String(e)); return refresh(); });
  }
  const programKey = p => p.icon ? el('span', { className: 'key' }, picture(p.icon)) : svgKey(ICON.app);
  const DOCK_LINE = { placed: 'dock_line', returns: 'dock_back', refused: 'dock_refused', several: 'dock_several', missing: 'dock_missing', broken: 'dock_broken' };
  function drawDocked() {
    $('docked').hidden = $('docked-foot').hidden = !!S.error;
    const rows = S.docked.map((d, i) => {
      const line = DOCK_LINE[d.state] || 'dock_line';
      return el('button', { className: 'row dock', onclick: () => editDocked(i) }, programKey(d),
        el('span', { className: 'lbl' }, el('b', { className: 'ell', textContent: d.name }),
          el('small', { className: 'ell' + (line === 'dock_line' ? '' : ' warn'), textContent: t(line) })),
        el('span', { className: 'chev', innerHTML: ICON.chev }));
    });
    $('docked').replaceChildren(...(rows.length ? rows : [say('docked_empty')]));
  }
  // A panel's card: where it stands and why, and Remove
  function editDocked(i) {
    const d = S.docked[i], line = DOCK_LINE[d.state] || 'dock_line';
    dialog(d.name, [el('div', { className: 'does' }, programKey(d), el('span', { className: 'lbl' },
      el('b', { className: line === 'dock_line' ? '' : 'warn', textContent: t(line) }), el('small', { textContent: t(line + '_why') })))],
      [btn('dock_remove', () => { closeDialog(); removeDocked(i); }, 'danger'), spring(), btn('close', closeDialog)], true);
  }
  function removeDocked(i) {
    const before = dockedRaws(), cards = [...S.docked];

  }
  // The panels at the capsule's edge now, those already docked left out; the ticked ones are
  // docked after them, in the order they are listed. Two windows of one program and class are
  // one entry: ticking one of them unticks the other
  function addDocked() {
    const list = el('div', { className: 'group', id: 'dock-list' }, say('dock_loading'));
    const ticked = new Set();
    let found = [];

    }, 'acc');

    invoke('dock_candidates').then(all => {
      found = (all || []).filter(p => !dockedRaws().some(raw => takes(raw, p.raw)));

        const row = pick(programKey(p), p.name, exeOf(p.raw), () => {

          for (const [q, r] of rows) r.classList.toggle('on', ticked.has(q));

  // Order: an item, or a meter, is carried by its dots with a finger, a pen or a mouse; the others
  // make room. `drop` is told the place the row left and the place it took
  let carried = null;
  function reorderable(list, drop) {
    list.addEventListener('pointerdown', e => {
      const grip = e.target.closest('.grip');
      if (!grip) return;
      const row = grip.parentElement, rows = [...list.children];
      carried = { list, row, id: e.pointerId, y: e.clientY, from: rows.indexOf(row), to: rows.indexOf(row), tops: rows.map(r => r.offsetTop), h: row.offsetHeight };
      grip.setPointerCapture(e.pointerId);
      row.classList.add('carried');
    });
    list.addEventListener('pointermove', e => {
      if (!carried || carried.list !== list || e.pointerId !== carried.id) return;
      const c = carried, rows = [...list.children];
    const dy = Math.max(-c.tops[c.from], Math.min(c.tops[c.tops.length - 1] - c.tops[c.from], e.clientY - c.y));
    c.row.style.transform = `translateY(${dy}px)`;
    const at = c.tops[c.from] + dy;
    c.to = c.tops.reduce((best, top, i) => Math.abs(top - at) < Math.abs(c.tops[best] - at) ? i : best, c.from);
    rows.forEach((r, i) => {
      if (r === c.row) return;
      const shift = i > c.from && i <= c.to ? -c.h : i < c.from && i >= c.to ? c.h : 0;
      r.style.transition = 'transform .12s';
      r.style.transform = shift ? `translateY(${shift}px)` : '';
    });
    });
    const dropRow = e => {
      if (!carried || carried.list !== list || e.pointerId !== carried.id) return;
      const { from, to } = carried;
      carried = null;
      drop(from, to);
    };
    list.addEventListener('pointerup', dropRow);
    list.addEventListener('pointercancel', dropRow);
  }
  reorderable($('items'), (from, to) => {
    if (from === to) return drawItems();
    const items = raws();

  // A meter goes the way the capsule moves one (`move_meter`), so the capsule and the values read

  reorderable($('meters'), (from, to) => {
    if (from === to) return drawMeters();
    const used = S.meters.map((m, i) => i).filter(i => !S.meters[i].problem);

  // Everywhere, or only while one program's window is active: one of those with windows now, or

    '.', ',', 'volumeup', 'volumedown', 'volumemute', 'playpause', 'nexttrack', 'prevtrack'];
  const CODES = { Space: 'space', Enter: 'enter', Tab: 'tab', Escape: 'esc', Backspace: 'backspace', Delete: 'delete', Insert: 'insert', Home: 'home', End: 'end',
    PageUp: 'pageup', PageDown: 'pagedown', ArrowLeft: 'left', ArrowUp: 'up', ArrowRight: 'right', ArrowDown: 'down', PrintScreen: 'printscreen',
    Period: '.', Comma: ',', AudioVolumeUp: 'volumeup', AudioVolumeDown: 'volumedown', AudioVolumeMute: 'volumemute',
    MediaPlayPause: 'playpause', MediaTrackNext: 'nexttrack', MediaTrackPrevious: 'prevtrack' };
  const MODS = ['ctrl', 'shift', 'alt', 'win'];
  const keyName = e => /^Key[A-Z]$/.test(e.code) ? e.code[3].toLowerCase() : /^Digit\d$/.test(e.code) ? e.code[5] : /^F\d{1,2}$/.test(e.code) ? e.code.toLowerCase() : CODES[e.code] || null;
  const keycaps = keys => el('span', { className: 'caps-row' }, ...keyParts(keys).flatMap((k, i) => [...(i ? [el('span', { className: 'plus', textContent: '+' })] : []), el('span', { className: 'kc', textContent: k })]));
  let onKeys = null;
  const stopKeys = () => { if (onKeys) window.removeEventListener('keydown', onKeys, true); onKeys = null; };
  function keysEditor(start, changed = () => {}) {
    const parts = (start || '').toLowerCase().split('+').map(p => p.trim());
    const state = { ctrl: parts.includes('ctrl'), shift: parts.includes('shift'), alt: parts.includes('alt'), win: parts.includes('win'), key: parts.find(p => KEYS.includes(p)) || '' };
    const mods = MODS.map(m => el('button', { className: 'btn', textContent: capKey(m), style: 'min-width:56px', onclick: () => { state[m] = !state[m]; draw(); } }));
    const key = el('select', { title: t('key'), style: 'min-width:90px' }, el('option', { value: '', textContent: '—' }), ...KEYS.map(k => el('option', { value: k, textContent: capKey(k) })));
    key.onchange = () => { state.key = key.value; draw(); };
    const value = () => state.key ? [...MODS.filter(m => state[m]), state.key].join('+') : '';
    const draw = () => { mods.forEach((c, i) => c.classList.toggle('acc', state[MODS[i]])); key.value = state.key; changed(value()); };
    stopKeys();
    onKeys = e => {
      if (e.target.matches?.('input[type=text]')) return;
      const k = keyName(e);
      if (!k) return;
      e.preventDefault();
      Object.assign(state, { ctrl: e.ctrlKey, shift: e.shiftKey, alt: e.altKey, win: e.metaKey, key: k });
      draw();
    };
    window.addEventListener('keydown', onKeys, true);
    const node = el('div', { className: 'field' }, el('span', { className: 'sub', textContent: t('keys_press') }), el('div', { className: 'inline', style: 'flex-wrap:wrap' }, ...mods, key));
    draw();
    return { node, value };
  }
  function addKeys() {
    const name = text(), shown = el('div', { className: 'does', style: 'justify-content:center;min-height:84px' });
    const keys = keysEditor('', v => shown.replaceChildren(v ? keycaps(v) : el('span', { className: 'sub', textContent: '—' })));
    const add = btn('add', () => {
      if (!keys.value()) return toast(t('need_key'));
      append({ name: name.value.trim() || pretty(keys.value()), icon: 'keyboard', action: 'hotkey', keys: keys.value() });
    }, 'acc');
    dialog(t('kind_keys'), [shown, keys.node, field(t('name'), name)], [spring(), add]);
  }

  // A ready set: its keys go to the end of the list, all for one program if one is chosen. Rust
  // leaves out what the list already has; the items there stay as they are
  function addBundle() {
    const where = wherePicker(), gos = [];
    // While Rust answers, no set can be added again: both answers would start from the same list
    const busy = on => { for (const g of gos) g.disabled = on; };
    const card = (name, items, go) => el('div', { className: 'group bundle' }, el('div', { className: 'set' },
      el('div', { className: 'inline', style: 'gap:10px' }, el('span', { className: 'lbl' }, el('b', { className: 'ell', textContent: name }), el('small', { textContent: t('bundle_keys') + items.length })), go),
      el('div', { className: 'icons' }, ...items.map(i => { const k = keyOf({ raw: i, glyph: S.glyphs[i.icon] }, 'small'); k.title = i.name; return k; }))));
    const blocks = S.bundles.map(b => {
      const go = btn('add', () => {
        if (where.missing()) return toast(t('need_program'));
        busy(true);
        invoke('bundle_items', { id: b.id, onlyIn: where.value() || null, items: raws() }).then(added => {
          if (!added?.length) return toast(t('bundle_none'));
          closeDialog();
          save([...raws(), ...added]);
          toast(t('bundle_added') + added.length);
        }).catch(e => toast(String(e))).finally(() => busy(false));
      });
      gos.push(go);
      return card(b.name, b.items, go);
    });
    // A set from a file is one more card under the ready ones. Its keys stay for the programs the
    // file names, so the choice above is not for them; Rust leaves out what the list already has
    // and what is not on this machine, and the page says how many of each
    const filed = el('div', { style: 'display:contents' });
    const loadKeys = () => invoke('open_key_set').then(set => {
      if (!set) return;
      const go = btn('add', () => {
        busy(true);
        invoke('key_set_items', { set: set.items, items: raws() }).then(r => {
          if (r.added.length) { closeDialog(); save([...raws(), ...r.added]); }
          toast(t('set_added') + r.added.length + t('set_had') + r.had + t('set_missing') + r.missing);
        }).catch(() => toast(t('set_not'))).finally(() => busy(false));
      });
      gos[S.bundles.length] = go;
      filed.replaceChildren(card(set.name, set.items, go));
      go.scrollIntoView({ block: 'nearest' });
    }).catch(() => toast(t('set_not')));
    // The user's own keys go into a file: all of them, or those of one of the programs that have
    // keys of their own, by name. Rust opens the Windows dialog and writes the items only
    const saving = el('div', { style: 'display:contents' });
    const writeKeys = onlyIn => invoke('save_key_set', { name: t('set_file'), onlyIn }).then(n => {
      if (n == null) return;
      saving.replaceChildren();
      toast(t('set_saved') + n);
    }).catch(e => toast(T[lang]['set_' + e] ?? String(e)));
    const saveKeys = () => {
      const mine = S.items.filter(i => !i.problem);
      if (!mine.length) return toast(t('empty'));
      const progs = [...new Map(mine.map(i => [str(fields(i.raw).only_in).trim().toLowerCase(), i]).filter(([exe]) => exe)
        .map(([exe, i]) => [exe, { name: i.only || exe.replace(/\.exe$/, ''), exe }])).values()];
      if (!progs.length) return writeKeys(null);
      let one = false, prog = '';
      const seg = el('div', { className: 'seg' }), chips = el('div', { className: 'progs' });
      const draw = () => {
        seg.replaceChildren(...[['set_all', false], ['set_one', true]].map(([key, v]) => el('button', { className: one === v ? 'on' : '', textContent: t(key), onclick: () => { one = v; draw(); } })));
        chips.hidden = !one;
        chips.replaceChildren(...progs.map(p => el('button', { className: 'prog' + (p.exe === prog ? ' on' : ''), textContent: p.name, onclick: () => { prog = p.exe; draw(); } })));
      };
      draw();
      const go = btn('save', () => one && !prog ? toast(t('need_program')) : writeKeys(one ? prog : null), 'acc');
      saving.replaceChildren(el('div', { className: 'inline', id: 'set-save', style: 'align-items:flex-start' }, el('div', { style: 'flex:1' }, seg, chips), go));
      go.scrollIntoView({ block: 'nearest' });
    };
    const tools = el('div', { className: 'inline', id: 'set-tools', style: 'flex-wrap:wrap' }, btn('set_save', saveKeys), btn('set_load', loadKeys));
    dialog(t('kind_bundle'), [field(t('bundle_where'), where.node), ...blocks, filed, tools, saving]);
  }

  // ---------- an item's card: name, hint, what it does, its picture and where it shows; fields
  // this window does not show stay in the item
  function editItem(i) {
    const item = S.items[i], kind = kindOf(item.raw);
    const remove = btn('remove', () => { closeDialog(); removeItem(i); }, 'danger');
    // Details: the target or the keys to change and, for an item that does not work, the parser's
    // words for what went wrong; the card itself says it in words
    const details = (inner, open) => el('details', { open }, el('summary', { textContent: t('more') }), el('div', { className: 'more' }, ...inner));
    const why = item.problem ? [el('div', { className: 'why', textContent: item.problem })] : [];
    const broken = el('div', { className: 'does' }, el('span', { className: 'lbl' }, el('b', { className: 'problem', textContent: t('broken_card') })));
    if (fields(item.raw) !== item.raw) return dialog(nameOf(item.raw), [broken, details(why, true)], [remove, spring(), btn('cancel', closeDialog)], true);
    const raw = { ...item.raw };
    const name = text(str(raw.name)), hint = text(str(raw.hint), t('hint_ph'));
    const big = el('span', { style: 'display:contents' });
    // What it does, in words
    let keys = null, target = null, box = null, more = [];
    if (raw.action === 'hotkey') {
      const shown = el('span', { className: 'lbl' });
      keys = keysEditor(str(raw.keys), v => shown.replaceChildren(v ? keycaps(v) : el('span', { className: 'sub', textContent: '—' })));
      box = el('div', { className: 'does' }, el('span', { textContent: t('does_keys') }), shown);
      more = [keys.node];
    } else if (raw.action === 'hold') {
      box = el('div', { className: 'does' }, el('span', { className: 'lbl' }, el('b', { textContent: t('does_hold') }), el('small', { textContent: t('does_hold_sub') })), keycaps(str(raw.keys)));
    } else if (raw.action === 'open') {
      target = text(str(raw.target), t('target'));
      const browse = directory => window.__TAURI__.dialog.open({ directory, multiple: false }).then(path => { if (path) target.value = path; });
      const page = kind === 'page' && S.pages.find(p => p.item.target.toLowerCase() === str(raw.target).trim().toLowerCase());
      // A program that is gone says so, and its path is open to choose another
      const sub = item.lost ? t('lost') : kind === 'app' ? t('does_app_sub') : page ? page.item.name : '';
      box = el('div', { className: 'does' }, el('span', { className: 'lbl' }, el('b', { textContent: t('does_' + (kind || 'file')) }), ...(sub ? [el('small', { className: item.lost ? 'problem' : '', textContent: sub })] : [])));
      more = [target, el('div', { className: 'inline' }, btn('pick_file', () => browse(false)), btn('pick_folder', () => browse(true)))];
    }
    if (item.problem) box = broken;
    // Found in one other place, which may be another program of the same file name: one tap puts it in
    const offer = item.found ? [el('div', { className: 'inline', style: 'margin-top:8px' }, el('span', { className: 'sub ell', textContent: t('found_in') + item.found, style: 'flex:1' }),
      btn('use_it', () => invoke('use_path', { target: str(raw.target) }).then(closeDialog).catch(e => toast(String(e))), 'acc'))] : [];
    const does = box ? [box, ...offer, ...(more.length || why.length ? [details([...why, ...more], !!item.problem || !!item.lost)] : [])] : [];
    // The picture: the program's own, one of the built-in ones, or a file of the user's; the
    // built-in ones open on request
    let icon = str(raw.icon), open = false;
    const glyphs = el('div', {});
    const drawIcon = () => {
      const now = icon && S.glyphs[icon] ? svgKey(S.glyphs[icon], 'small') : icon === str(item.raw.icon) ? keyOf(item, 'small') : svgKey(neutral(raw), 'small');
      big.replaceChildren(icon && S.glyphs[icon] ? svgKey(S.glyphs[icon], 'big') : icon === str(item.raw.icon) ? keyOf(item, 'big') : svgKey(neutral(raw), 'big'));
      const what = icon ? (S.glyphs[icon] ? t('icon_builtin') : t('icon_own_on')) : raw.action === 'open' ? t('icon_auto') : t('icon_kind');
      const auto = el('button', { className: 'btn' + (icon ? '' : ' acc'), textContent: raw.action === 'open' ? t('icon_auto') : t('icon_none'), onclick: () => { icon = ''; drawIcon(); } });
      const own = el('button', { className: 'btn' + (icon && !S.glyphs[icon] ? ' acc' : ''), textContent: t('icon_own'), onclick: () =>
        window.__TAURI__.dialog.open({ multiple: false, filters: [{ name: 'PNG, SVG', extensions: ['png', 'svg'] }] })
          .then(path => path && invoke('import_icon', { path })).then(file => { if (file) { icon = file; drawIcon(); } }).catch(e => toast(String(e))) });
      glyphs.replaceChildren(el('div', { className: 'inline' }, now, el('span', { className: 'sub', textContent: what, style: 'flex:1' }),
        el('button', { className: 'btn', textContent: t(open ? 'icon_fold' : 'icon_change'), onclick: () => { open = !open; drawIcon(); } })),
        ...(open ? [el('div', { className: 'inline', style: 'margin-top:8px' }, auto, own),
          el('div', { className: 'gl' }, ...Object.keys(S.glyphs).map(g => el('button', { className: g === icon ? 'on' : '', title: g, onclick: () => { icon = g; drawIcon(); } }, glyphKey(g))))] : []));
    };
    drawIcon();
    const before = str(raw.only_in).trim();
    const where = wherePicker(before, item.only || '');
    const done = btn('save', () => {
      if (!name.value.trim()) return toast(t('need_name'));
      if (keys && !keys.value()) return toast(t('need_key'));
      if (target && !target.value.trim()) return toast(t('need_target'));
      if (where.missing()) return toast(t('need_program'));
      // Only what the card changed goes onto the item as the file has it now: the panel may have put
      // its path right while the card was open. The fields are set in place, so their order in the
      // file and the fields not shown here stay
      const changed = [['name', name.value.trim()], ['icon', icon], ['hint', hint.value.trim()], ['only_in', where.value(), before],
        ...(keys ? [['keys', keys.value()]] : []), ...(target ? [['target', target.value.trim()]] : [])].filter(([k, v, was = str(item.raw[k]).trim()]) => v !== was);
      closeDialog();
      refresh().then(() => {
        const same = S.items.findIndex(x => JSON.stringify(x.raw) === JSON.stringify(item.raw));
        const at = same >= 0 ? same : Math.min(i, S.items.length);
        const fresh = { ...(S.items[at] ? fields(S.items[at].raw) : raw) };
        for (const [k, v] of changed) { if (v) fresh[k] = v; else delete fresh[k]; }
        const items = raws();
        items[at] = fresh;
        save(items);
      });
    }, 'acc');
    const look = () => JSON.stringify([name.value, hint.value, icon, where.value(), keys && keys.value(), target && target.value]);
    const start = look();
    dialog(t('edit_title'), [el('div', { className: 'namebox' }, big, name), field(t('hint'), hint),
      ...(does.length ? [field(t('does'), ...does)] : []), field(t('icon'), glyphs), field(t('only_in'), where.node)],
      [remove, spring(), btn('cancel', closeDialog), done], true);
    cardEdits = () => look() !== start;
  }

  // ---------- look and general: every change goes to the file at once and shows at once
  const ACCENTS = ['#8ab4ff', '#4cc2ff', '#2ee6c5', '#5fe36a', '#ffc53d', '#ff9a3c', '#ff5c7a', '#b57bff'];
  let accentTimer = null;
  function setPref(key, value) { S[key] = value; paint(); drawPrefs(); return invoke('set_pref', { key, value }).catch(e => toast(String(e))); }
  // A theme shown as a small window of its own: the page, a list beside it, the capsule at the edge
  const preview = (bg, card) => el('span', { className: 'pv', style: `background:${bg}` }, ...[['8%', '12%', '22%', '76%'], ['36%', '12%', '56%', '30%'], ['36%', '50%', '56%', '38%']]
    .map(([left, top, width, height]) => el('i', { style: `left:${left};top:${top};width:${width};height:${height};background:${card}` })),
    el('i', { style: 'right:4%;top:22%;width:7%;height:56%;border-radius:6px;background:#0e0f12;box-shadow:0 0 0 1px #444' }));
  function drawPrefs() {
    $('theme').replaceChildren(...[['system', 'linear-gradient(90deg,#161616 50%,#dedfe3 50%)', 'rgba(128,128,128,.55)'], ['dark', '#161616', '#2d2d2d'], ['light', '#dedfe3', '#ffffff']]
      .map(([v, bg, card]) => { const b = el('button', { className: 'th' + (S.theme === v ? ' on' : ''), onclick: () => setPref('theme', v) }, preview(bg, card), el('span', { textContent: t('theme_' + v) })); b.dataset.v = v; return b; }));
    $('lang').value = S.lang;
    for (const b of $('scale').children) b.classList.toggle('on', Number(b.dataset.v) === S.scale);
    for (const b of $('edge').children) b.classList.toggle('on', b.dataset.v === S.edge);
    $('capsule').style.transform = `scale(${S.scale})`;
    $('capsule').replaceChildren(...['snip', 'paste', 'mic'].map(g => glyphKey(g)));
    $('autostart').classList.toggle('on', S.autostart);
    $('updates').classList.toggle('on', S.updates);
    $('tablet-only').classList.toggle('on', S.tablet_only);
    $('click-sound').classList.toggle('on', S.click_sound);
    if (!$('swatches').querySelector('input:focus')) {
      const mine = !ACCENTS.includes(S.accent);
      const own = el('input', { type: 'color', value: S.accent, title: t('accent_own') });
      own.oninput = () => {
        S.accent = own.value; paint();
        for (const s of $('swatches').querySelectorAll('.swatch')) s.classList.toggle('on', s.dataset.v === S.accent);
        own.parentElement.classList.toggle('on', !ACCENTS.includes(S.accent));
        clearTimeout(accentTimer);
        accentTimer = setTimeout(() => invoke('set_pref', { key: 'accent', value: S.accent }), 120);
      };
      const ownBox = el('label', { className: 'own' + (mine ? ' on' : ''), innerHTML: ICON.plus, title: t('accent_own') });
      if (mine) ownBox.style.background = S.accent;
      ownBox.append(own);
      $('swatches').replaceChildren(...ACCENTS.map(c => {
        const s = el('button', { className: 'swatch' + (c === S.accent ? ' on' : ''), title: c, onclick: () => setPref('accent', c) });
        s.dataset.v = c; s.style.background = c;
        return s;
      }), ownBox);
    }
    $('version').textContent = 'Tapka ' + S.version;
    drawUpdate();
  }
  $('lang').onchange = () => invoke('set_pref', { key: 'lang', value: $('lang').value }).then(refresh);
  $('scale').onclick = e => { const b = e.target.closest('button'); if (b) setPref('scale', Number(b.dataset.v)); };
  $('edge').onclick = e => { const b = e.target.closest('button'); if (b) setPref('edge', b.dataset.v); };
  $('autostart').onclick = () => setPref('autostart', !S.autostart);
  $('updates').onclick = () => setPref('updates', !S.updates).then(refresh);
  $('tablet-only').onclick = () => setPref('tablet_only', !S.tablet_only);
  $('click-sound').onclick = () => setPref('click_sound', !S.click_sound);
  $('open-file').onclick = () => invoke('open_settings_file');
  $('open-log').onclick = () => invoke('open_log_folder');
  $('github').onclick = () => invoke('open_github');

  // ---------- updates: quiet, no pop-ups; the panel never claims to be the latest before a check passed
  function drawUpdate() {
    const u = S.update || { state: 'none' };
    const state = !S.updates && u.state !== 'found' ? 'off' : u.state;
    $('update-state').textContent = state === 'found' ? t('update_found') + u.version : t('update_' + state) + (['latest', 'none', 'failed'].includes(state) ? ', ' + S.version : '');
    $('update-state').title = state === 'failed' && u.why ? u.why : '';
    $('update-go').hidden = state !== 'found';
    $('update-check').hidden = state === 'found' || state === 'loading' || state === 'checking' || !S.updates;
  }
  $('update-check').onclick = () => { S.update = { state: 'checking' }; drawUpdate(); invoke('check_update').then(refresh); };
  $('update-go').onclick = () => { S.update = { state: 'loading' }; drawUpdate(); invoke('install_update').catch(e => { S.update = { state: 'failed', why: String(e) }; drawUpdate(); }); };

  // ---------- everything comes from Rust and is drawn anew whenever the file changes
  let welcomed = false;
  // The welcome window is made as tall as its card, programs whole, and Rust keeps it beside the
  // capsule and inside the work area. The card is measured as tall as its content, fractions of a
  // pixel and all: heights added up whole pixel by whole pixel came out short of a few, and the
  // programs scrolled in a window meant to hold them. One pixel more covers the rounding to the
  // screen's pixels
  function fitWelcome() {
    const box = $('welcome');
    box.style.height = 'auto';
    const height = box.getBoundingClientRect().height;
    box.style.height = '';
    invoke('fit_welcome', { height: Math.ceil(height) + 1 });
  }
  function refresh() {
    return invoke('get_settings').then(s => {
      S = s;
      S.meters = S.meters || [];
      S.docked = S.docked || [];
      paint(); words(); drawPrefs(); drawMeters(); drawDocked();
      readStatus();
      if (!carried) drawItems();
      // The welcome window shows its card once, in the language and the theme of the settings
      if (WELCOME && !welcomed) {
        welcomed = true;
        $('welcome').append(...programCard(() => invoke('close_welcome'), fitWelcome));
      }
      // A tap on a grey key of the capsule opens that item's card
      // ...unless a card with edits not saved yet is open: those are not thrown away
      if (!WELCOME && S.card != null && S.items[S.card]) {
        if (cardEdits && cardEdits()) toast(t('card_busy'));
        else { show('items'); editItem(S.card); }
      }

    });
  }
  window.__TAURI__.event.listen('reload', refresh);
  window.__TAURI__.event.listen('section', e => show(e.payload));
  refresh();
</script>
